[package]
name = "dih_dah_dojo"
version = "0.1.0"
edition = "2024"

[dependencies]
dojo-core = { path = "crates/dojo-core" }
chrono = "=0.4.45"
cpal = "=0.18.2"
crossterm = "=0.29.0"
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29"] }
redb = "=4.6.0"
rtrb = "=0.4.1"
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.10.9"
statrs = { version = "=0.19.1", default-features = false, features = ["std"] }

[workspace]
members = ["crates/dojo-core", "crates/dojo-wasm"]
default-members = [".", "crates/dojo-core", "crates/dojo-wasm"]
resolver = "3"

[package]
name = "dojo-wasm"
version = "0.1.0"
edition = "2024"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
dojo-core = { path = "../dojo-core" }
wasm-bindgen = "=0.2.130"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1"
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
rtrb = "=0.4.1"

name: Frontend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Set up Rust for WebAssembly
        run: |
          rustup toolchain install 1.94.0 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.94.0
      - name: Resolve the matching wasm-bindgen CLI version
        id: bindgen
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '
            .packages[] | select(.name == "dojo-wasm")
            | .dependencies[] | select(.name == "wasm-bindgen")
            | .req | ltrimstr("=")
          ')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: bindgen-cache
        with:
          path: ${{ runner.temp }}/dojo-wasm-tools
          key: wasm-bindgen-${{ runner.os }}-${{ runner.arch }}-rust-1.94.0-${{ steps.bindgen.outputs.version }}
      - name: Install wasm-bindgen CLI
        if: steps.bindgen-cache.outputs.cache-hit != 'true'
        env:
          WASM_BINDGEN_VERSION: ${{ steps.bindgen.outputs.version }}
        run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked --root "$RUNNER_TEMP/dojo-wasm-tools"
      - name: Build WebAssembly
        run: WASM_BINDGEN_BIN="$RUNNER_TEMP/dojo-wasm-tools/bin/wasm-bindgen" ./scripts/build-wasm.sh
      - run: npm ci
      - run: npm test
      - name: Build the production frontend
        env:
          VITE_API_ORIGIN: https://dojoapi.veryshyjelly.in
        run: npm run build
      - name: Validate the Cloudflare bundle
        run: ./node_modules/.bin/wrangler deploy --dry-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.ref == 'refs/heads/main'
        with:
          name: frontend
          path: web/dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://dojo.veryshyjelly.in
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: frontend
          path: web/dist/
      - name: Check that this is still the head of main
        run: |
          main=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [[ "$main" != "$GITHUB_SHA" ]]; then
            echo "::error::main advanced while this run was building. Deploy from the latest run."
            exit 1
          fi
      - name: Deploy the tested static assets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the CLOUDFLARE_ACCOUNT_ID production variable}"
          : "${CLOUDFLARE_API_TOKEN:?Set the CLOUDFLARE_API_TOKEN production secret}"
          ./node_modules/.bin/wrangler deploy --message "GitHub Actions ${GITHUB_SHA}"
      - name: Verify the deployed frontend and SPA routing
        run: |
          entry=$(grep -oE 'src="/assets/index-[^"]+\.js"' dist/index.html)
          for attempt in {1..12}; do
            if home=$(curl --fail --silent --show-error --max-time 5 https://dojo.veryshyjelly.in/) &&
              words=$(curl --fail --silent --show-error --max-time 5 https://dojo.veryshyjelly.in/words) &&
              [[ "$home" == *"$entry"* && "$words" == *"$entry"* ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::The production homepage and /words did not serve the built frontend."
          exit 1
